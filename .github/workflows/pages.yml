# Baut die Seite aus diesem Branch (`pages`) und veroeffentlicht sie
# ueber GitHub Pages. In den Repo-Einstellungen muss unter
# Settings -> Pages als Source "GitHub Actions" eingestellt sein.
name: Seite bauen und veroeffentlichen

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laeuft immer nur eine Veroeffentlichung gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Liest public/medien/ ein und baut den statischen Export nach out/.
      - run: npm run build
        env:
          # Die Seite liegt unter https://bastild.github.io/S-N/
          NEXT_PUBLIC_BASE_PATH: /S-N

      # Ohne .nojekyll wirft GitHub Pages alle Ordner weg, die mit _
      # anfangen — und genau so heisst Next.js' Asset-Ordner (_next).
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
